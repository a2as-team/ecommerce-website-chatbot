models:
  gemini-2.0-flash:
    type: literal
    agents: [SmartAddItemToOrder, order_agent, shop_agent, coordinator, web_search_tool.0, chatchit_agent, web_search_tool.1,
      product_agent, cart_agent]

tools:
  access_cart_information:
    type: function
    agents: [SmartAddItemToOrder, cart_agent]
  add_item_to_cart:
    type: function
    agents: [SmartAddItemToOrder, cart_agent]
  detailed_specs_search_hybrid:
    type: wrapper
    agents: [product_agent]
    params:
      wrapper: FunctionTool
      wraps: detailed_specs_search_hybrid
  enforce_cart_requirement:
    type: function
    agents: [SmartAddItemToOrder]
    params:
      description: |-
        Kiểm tra bắt buộc: Tất cả sản phẩm muốn đặt hàng phải có trong giỏ hàng

        Args:
            requested_products: JSON string danh sách sản phẩm người dùng muốn đặt hàng
            cart_items: JSON string danh sách sản phẩm hiện có trong giỏ hàng

        Returns:
            Dict chứa kết quả kiểm tra và hướng dẫn tiếp theo
  find_cart_item:
    type: function
    agents: [SmartAddItemToOrder, cart_agent]
  find_product_id_by_group_and_color:
    type: function
    agents: [SmartAddItemToOrder, cart_agent]
  google_search:
    type: module
    agents: [web_search_tool.0, web_search_tool.1]
  prepare_checkout_data:
    type: function
    agents: [order_agent]
    params:
      description: |-
        Chuẩn bị dữ liệu cho trang checkout với danh sách sản phẩm đã chọn

        Args:
            selected_products: JSON string danh sách sản phẩm với thông tin {productId, color, productName, price}
            quantities: JSON string danh sách số lượng tương ứng với mỗi sản phẩm (mặc định là 1)

        Returns:
            Dict chứa selectedItems và checkout_url để redirect
  product_consultation_tool_mongo:
    type: wrapper
    agents: [product_agent]
    params:
      wrapper: FunctionTool
      wraps: product_consultation_tool_mongo
  product_information_tool:
    type: wrapper
    agents: [product_agent]
    params:
      wrapper: FunctionTool
      wraps: product_information_tool
  product_information_tool_for_cart:
    type: function
    agents: [SmartAddItemToOrder, cart_agent]
  redirect_to_checkout_tool:
    type: function
    agents: [order_agent]
  remove_item_from_cart:
    type: function
    agents: [cart_agent]
  shop_information_tool:
    type: wrapper
    agents: [shop_agent]
    params:
      wrapper: FunctionTool
      wraps: shop_information_tool
  SmartAddItemToOrder:
    type: agent
    agents: [order_agent]
    params:
      wrapper: AgentTool
      agent: SmartAddItemToOrder
  update_item_in_cart:
    type: function
    agents: [cart_agent]
  web_search_tool:
    type: agent
    agents: [chatchit_agent, product_agent]
    params:
      wrapper: AgentTool
      agent: web_search_tool

teams:
  coordinator:
    type: hierarchy
    agents: [coordinator, chatchit_agent, shop_agent, product_agent, cart_agent, order_agent]

